name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-14          # Apple Silicon, Xcode 15+
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # macOS: build + test (CoreBluetooth + IOBluetooth available)
      - name: Build Tests (macOS)
        run: swift build --build-tests

      - name: Test — Parser (macOS)
        run: swift test -v --filter ThinkGearParserTests 2>&1

      - name: Test — Simulator Integration (macOS)
        run: swift test -v --filter SimulatorIntegrationTests 2>&1
        continue-on-error: true

      # iOS: compile-check against the iOS Simulator SDK using swift build
      - name: Build (iOS Simulator)
        run: |
          swift build \
            -Xswiftc "-sdk" \
            -Xswiftc "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -Xswiftc "-target" \
            -Xswiftc "arm64-apple-ios14.0-simulator"
